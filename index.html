<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Umut IPTV</title>

<style>
:root{
  color-scheme:dark;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#080b10;
  color:#fff;
}

.wrap{
  max-width:900px;
  margin:auto;
  padding:20px;
}

h1{
  margin:0 0 6px;
  font-size:28px;
}

.sub{
  color:#8f98a8;
  margin-bottom:20px;
}

.card{
  background:#151a21;
  border:1px solid #292f39;
  border-radius:16px;
  padding:16px;
  margin-bottom:16px;
}

label{
  display:block;
  color:#aeb7c5;
  margin-bottom:8px;
}

input,
button,
select{
  width:100%;
  border:0;
  border-radius:12px;
  padding:13px;
  font-size:16px;
}

input,
select{
  background:#0d1117;
  color:#fff;
  border:1px solid #303744;
}

button{
  background:#ef6d7f;
  color:#fff;
  font-weight:700;
  margin-top:10px;
}

button.secondary{
  background:#252b37;
}

button:active{
  opacity:.7;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.status{
  padding:12px;
  border-radius:10px;
  background:#0d1117;
  color:#9ca6b5;
  margin-top:12px;
}

#groups{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
  gap:10px;
}

.group{
  background:#202631;
  border:1px solid #303744;
  border-radius:12px;
  padding:14px;
  text-align:left;
  color:#fff;
}

#channels{
  display:grid;
  gap:8px;
}

.channel{
  background:#171d25;
  border:1px solid #2c3440;
  border-radius:12px;
  padding:13px;
  color:#fff;
  text-align:left;
}

video{
  width:100%;
  background:#000;
  border-radius:14px;
  display:none;
  margin-top:12px;
}

.hidden{
  display:none!important;
}

.small{
  font-size:13px;
  color:#858f9e;
}
</style>
</head>

<body>

<div class="wrap">

<h1>Umut IPTV</h1>
<div class="sub">IPTV Player</div>

<div class="card">

<label>Cloudflare Worker</label>

<input
id="worker"
type="url"
value="https://47f4fef8-umut-iptv.h27zpz6p5p.workers.dev"
>

<div class="grid">
<button onclick="connect()">Verbinden</button>
<button class="secondary" onclick="loadGroups()">Sender laden</button>
</div>

<div id="status" class="status">
Noch nicht verbunden
</div>

</div>

<div class="card">

<h3>Kategorien</h3>

<div id="groups"></div>

</div>

<div class="card">

<h3>Sender</h3>

<div id="channels"></div>

</div>

<div class="card">

<video id="player" controls playsinline></video>

<div id="playerStatus" class="small">
Kein Sender ausgewählt
</div>

</div>

</div>

<script>

const state = {
  worker: "",
  connected: false,
  categories: [],
  channels: []
};

function getWorker(){
  return document.getElementById("worker").value.trim().replace(/\/+$/,"");
}

function status(text){
  document.getElementById("status").textContent = text;
}

async function api(action=""){
  const url =
    getWorker() +
    "/player_api.php" +
    (action ? "?" + action : "");

  const response = await fetch(url);

  if(!response.ok){
    throw new Error("HTTP " + response.status);
  }

  return await response.json();
}

async function connect(){

  try{

    status("Verbinde mit IPTV-Server …");

    const data = await api();

    if(data.auth !== 1){
      throw new Error("IPTV-Anmeldung fehlgeschlagen");
    }

    state.worker = getWorker();
    state.connected = true;

    status(
      "Verbunden ✓ – Konto " +
      (data.status || "aktiv")
    );

    await loadGroups();

  }catch(error){

    console.error(error);

    status(
      "Fehler: " +
      (error.message || error)
    );
  }
}

async function loadGroups(){

  if(!state.connected){
    await connect();
    return;
  }

  try{

    status("Lade Kategorien …");

    const data =
      await api("action=get_live_categories");

    state.categories = Array.isArray(data) ? data : [];

    renderGroups();

    status(
      state.categories.length +
      " Kategorien geladen ✓"
    );

  }catch(error){

    console.error(error);

    status(
      "Kategorien konnten nicht geladen werden: " +
      error.message
    );
  }
}

function renderGroups(){

  const box =
    document.getElementById("groups");

  box.innerHTML = "";

  state.categories.forEach(category => {

    const button =
      document.createElement("button");

    button.className = "group";

    button.textContent =
      category.category_name || "Kategorie";

    button.onclick = () =>
      loadChannels(category.category_id);

    box.appendChild(button);
  });
}

async function loadChannels(categoryId){

  try{

    status("Lade Sender …");

    const data =
      await api(
        "action=get_live_streams&category_id=" +
        encodeURIComponent(categoryId)
      );

    state.channels =
      Array.isArray(data) ? data : [];

    renderChannels();

    status(
      state.channels.length +
      " Sender geladen ✓"
    );

  }catch(error){

    console.error(error);

    status(
      "Sender konnten nicht geladen werden: " +
      error.message
    );
  }
}

function renderChannels(){

  const box =
    document.getElementById("channels");

  box.innerHTML = "";

  state.channels.forEach(channel => {

    const button =
      document.createElement("button");

    button.className = "channel";

    button.textContent =
      channel.name || "Sender";

    button.onclick = () =>
      playChannel(channel);

    box.appendChild(button);
  });
}

function playChannel(channel){

  const player =
    document.getElementById("player");

  const streamId =
    channel.stream_id;

  if(!streamId){
    return;
  }

  /*
    Der Stream wird später ebenfalls
    über den Cloudflare Worker geleitet.
    Dadurch bleiben Benutzername und Passwort
    aus dem Browser verborgen.
  */

  const streamUrl =
    getWorker() +
    "/stream/" +
    encodeURIComponent(streamId) +
    ".m3u8";

  player.src = streamUrl;
  player.style.display = "block";

  document.getElementById("playerStatus").textContent =
    "Starte: " + (channel.name || "Sender");

  player.play().catch(() => {});
}

</script>

</body>
</html>
